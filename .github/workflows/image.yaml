# Builds the review image for Datum Compute and pushes it to
# ghcr.io/example-user/pr-autopilot-review:<tag>, where <tag> is a hash of the
# files the image is built from (remote_review.IMAGE_FILES). The laptop computes
# the same tag from its own checkout, so it only ever runs the image that
# matches its code, and reviews on the laptop until this job has pushed it.
name: Review image

on:
  push:
    branches: [main]
    # The files remote_review.IMAGE_FILES hashes into the tag, plus the code that holds that
    # list. Not remote/**: the dispatcher's files there do not change this image.
    paths:
      - remote/Dockerfile
      - remote/review-job.py
      - full_review.py
      - pr_worker.py
      - github_api.py
      - claude_cli.py
      - render-diff
      - remote_review.py
      - .github/workflows/image.yaml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute the image tag
        id: tag
        run: echo "tag=$(python3 -c 'import remote_review; print(remote_review.image_tag())')" >> "$GITHUB_OUTPUT"

      # A tag names one set of files: never rebuild it, so it keeps meaning the same image.
      - name: Skip if this tag is already published
        id: exists
        run: |
          if docker manifest inspect "ghcr.io/example-user/pr-autopilot-review:${{ steps.tag.outputs.tag }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.exists.outputs.published != 'true'

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: steps.exists.outputs.published != 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        if: steps.exists.outputs.published != 'true'
        with:
          context: .
          file: remote/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/example-user/pr-autopilot-review:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
